{% extends 'base.html' %}
{% load static %}

{% block content %}
    <link rel="stylesheet" href="{% static 'styles/cats-clean.css' %}?v=6">
    <main>
            <div>
                <h2>¡Hola!</h2>
                <p>Esta es la página principal de Mishilovers.</p>
            </div>
            <section>
                <h3>Sobre nosotros</h3>
                <p>Amamos a los gatos y compartimos fotos, historias y consejos para cuidarlos.</p>
            </section>
            <div class="actions">
                <a href="/cats/formNewCat" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Crear gatos
                </a>
                <a href="{% url 'sterilized_counter' %}" class="btn btn-info">
                    <i class="fas fa-chart-bar"></i> Ver contador de esterilizaciones
                </a>
            </div>
            <div class="search-form-container">
                <h3>🔍 Buscar Gatos</h3>
                <form action="{% url 'searchEditCat' %}" method="get" class="search-form">
                    <div class="form-group" data-tooltip="Ingresa el nombre del gato a buscar">
                        <label for="catname">Nombre del gato</label>
                        <input type="text" id="catname" name="catname" placeholder="Nombre del gato" class="form-control">
                    </div>
                    <div class="form-group" data-tooltip="Selecciona la colonia donde buscar">
                        <label for="colony">Colonia</label>
                        <select id="colony" name="colony" class="form-control">
                            <option value="">Seleccionar colonia</option>
                            {% for colony in colonies %}
                                <option value="{{ colony.id }}">{{ colony.name }}</option>
                            {% empty %}
                                <option value="">No hay colonias</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" data-tooltip="Filtrar por sexo del gato">
                        <label for="sex">Sexo</label>
                        <select id="sex" name="sex" class="form-control">
                            <option value="">Seleccionar sexo</option>
                            <option value="M">Macho</option>
                            <option value="F">Hembra</option>
                        </select>
                    </div>
                    <div class="form-group" data-tooltip="Filtrar por estado de esterilización">
                        <label for="sterilized">¿Esterilizado?</label>
                        <select id="sterilized" name="sterilized" class="form-control">
                            <option value="">Seleccionar estado</option>
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div class="form-group" data-tooltip="Filtrar por estado de vida">
                        <label for="dead">Estado</label>
                        <select id="dead" name="dead" class="form-control">
                            <option value="">Seleccionar estado</option>
                            <option value="false">Vivo</option>
                            <option value="true">Fallecido</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i> Buscar gatos
                        </button>
                    </div>
                </form>
            </div>
        </main>
    
    <!-- Scripts comentados temporalmente para evitar interferencia -->
    <!-- <script src="{% static 'js/form-enhanced.js' %}"></script> -->
    <!-- <script src="{% static 'js/cats.js' %}"></script> -->
    {% endblock %}
