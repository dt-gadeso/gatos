{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/veterinarian.css' %}">

<div class="veterinarian-container">
    <h2>🏥 Veterinarios</h2>
    <p>Gestiona y busca centros veterinarios para el cuidado de nuestros felinos.</p>
    
    <section class="search-section">
        <h3>🔍 Buscar Veterinarios</h3>
        <div class="search-form-container">
            <form action="{% url 'search_vet_centers' %}" method="get" class="search-form">
                <div class="form-group">
                    <label for="name">Nombre del centro veterinario</label>
                    <input type="text" id="name" name="name" placeholder="Ingresa el nombre del centro" value="{{ request.GET.name }}">
                </div>
                
                <div class="form-group">
                    <label for="location">Ubicación</label>
                    <select id="location" name="location">
                        <option value="">Seleccionar ubicación</option>
                        {% for location in locations %}
                            <option value="{{ location.id }}" {% if request.GET.location == location.id|stringformat:"s" %}selected{% endif %}>
                                {% if location.nombre %}
                                    {{ location.nombre }} - {{ location.address }}
                                {% else %}
                                    {{ location.address }}, {{ location.municipality.name }}
                                {% endif %}
                            </option>
                        {% empty %}
                            <option value="">No hay ubicaciones disponibles</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email del centro</label>
                    <input type="email" id="email" name="email" placeholder="contacto@veterinario.com" value="{{ request.GET.email }}">
                </div>
                
                <button type="submit" class="btn-primary">🔍 Buscar veterinario</button>
            </form>
        </div>
    </section>
    
    <section class="management-section">
        <h3>⚙️ Gestión</h3>
        <div class="management-buttons">
            <button type="button" class="map-btn" onclick="window.location.href='/veterinarian/formNewVetCenter'">
                🏥 Registrar centro veterinario
            </button>
            <button type="button" class="map-btn" onclick="window.location.href='/veterinarian/formNewVisit'">
                📅 Registrar visita
            </button>
        </div>
    </section>
</div>

<script src="{% static 'js/veterinarian.js' %}"></script>
{% endblock %}
