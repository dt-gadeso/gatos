{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Asignar Rol a Usuario</h2>
<form method="POST">
    {% csrf_token %}
    <div>
        <label for="user_id">Usuario:</label>
        <select name="user_id" id="user_id" required>
            <option value="" disabled selected>Selecciona un usuario</option>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>
    </div> 
    <div>
        <label for="role_id">Rol:</label>
        <select name="role_id" id="role_id" required onchange="toggleAssociationSelect()">
            <option value="" disabled selected>Selecciona un rol</option>
            {% for role in roles %}
                <option value="{{ role.id }}">{{ role.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div id="association-div" style="display:none;">
        <label for="association_id">Asociación:</label>
        <select name="association_id" id="association_id">
            <option value="" disabled selected>Selecciona una asociación</option>
            {% for association in associations %}
                <option value="{{ association.id }}">{{ association.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" name="assign_role">Asignar Rol</button>
</form>

<hr>

<h2>Crear Nuevo Rol</h2>
<form method="POST">
    {% csrf_token %}
    <input type="hidden" name="create_role" value="1">
    <div>
        <label for="new_role_name">Nombre del nuevo rol:</label>
        <input type="text" name="new_role_name" id="new_role_name" required>
    </div>
    <button type="submit" name="create_role_btn">Crear Rol</button>
</form>

{% if error %}
    <div class="alert alert-danger mt-3">{{ error }}</div>
{% endif %}

{% if success %}
<div class="alert alert-success mt-3">{{ success }}</div>
{% endif %}
<h2>Borrar Rol</h2>
<form method="POST">
    {% csrf_token %}
    <input type="hidden" name="delete_role" value="1">
    <div>
        <label for="delete_role_id">Selecciona el rol a borrar:</label>
        <select name="delete_role_id" id="delete_role_id" required>
            <option value="" disabled selected>Selecciona un rol</option>
            {% for role in roles %}
                <option value="{{ role.id }}">{{ role.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" name="delete_role_btn" onclick="return confirm('¿Estás seguro de que deseas borrar este rol?');">Borrar Rol</button>
</form>
<script src="{% static 'js/users.js' %}">
</script>
{% endblock %}
