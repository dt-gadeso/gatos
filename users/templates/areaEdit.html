<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
    <h1>Editar Perfil</h1>
    <form action="/users/areaEdit/" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p style="color:green;">{{ success }}</p>
        {% endif %}

        {{ form.as_p }}
        <button type="submit">Guardar Cambios</button>
    </form>
</body>
</html>
