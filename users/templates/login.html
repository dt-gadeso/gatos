{% extends 'base.html' %}
{% load static %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
</head>
<body>
    <h1>Iniciar Sesión</h1>
    <form method="POST" action="/users/signin/">
        {% csrf_token %}
        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}

        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</body>
</html>
{% endblock %}
