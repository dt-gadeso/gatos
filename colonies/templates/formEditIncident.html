{% extends 'base.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Incidencia</title>
    <style>
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: #23272b;
            border-radius: 12px;
            color: #f1f1f1;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #90caf9;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #333;
            border-radius: 5px;
            background: #22292f;
            color: #f1f1f1;
        }
        .resolution-field {
            display: none;
            transition: all 0.3s ease;
        }
        .resolution-field.show {
            display: block;
        }
        .btn-submit {
            background: #1976d2;
            color: #fff;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Editar Incidencia</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Guardar</button>
        </form>
    </div>

    <script>
        function toggleResolutionField() {
            const isResolvedCheckbox = document.getElementById('id_is_resolved');
            const resolutionField = document.querySelector('.field-resolution') || 
                                  document.getElementById('id_resolution')?.closest('p');
            
            if (resolutionField) {
                if (isResolvedCheckbox.checked) {
                    resolutionField.classList.add('show');
                    resolutionField.style.display = 'block';
                } else {
                    resolutionField.classList.remove('show');
                    resolutionField.style.display = 'none';
                    document.getElementById('id_resolution').value = '';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            toggleResolutionField();
        });
    </script>
</body>
</html>
{% endblock %}
