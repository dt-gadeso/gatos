{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/formularios_multiples.css' %}">

<div class="forms-container">
    <div class="form-section">
        <h2>Nuevo Relevo</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Guardar</button>
        </form>
    </div>
</div>
{% endblock %}
